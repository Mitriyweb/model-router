name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck + Lint + Tests
        run: bun run validate

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            artifact: model-router-linux-x64
          - target: linux-arm64
            runner: ubuntu-latest
            artifact: model-router-linux-arm64
          - target: darwin-arm64
            runner: ubuntu-latest
            artifact: model-router-darwin-arm64
          - target: darwin-x64
            runner: ubuntu-latest
            artifact: model-router-darwin-x64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: |
          mkdir -p dist
          bun build src/index.ts \
            --compile \
            --target=bun-${{ matrix.target }} \
            --outfile dist/${{ matrix.artifact }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum model-router-* > checksums.txt

      - name: Verify release artifacts exist
        run: |
          set -e
          ls -lh dist/
          for file in dist/model-router-* dist/checksums.txt; do
            [ -f "$file" ] || { echo "Missing artifact: $file"; exit 1; }
          done

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.tag.outputs.name }}"
          test -n "$TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "model-router $TAG" --generate-notes
          gh release upload "$TAG" dist/model-router-* dist/checksums.txt --clobber
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -ge 5
