name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multi-Platform Binaries & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run validation
        run: |
          bun run lint
          bun run typecheck
          bun test

      - name: Build standalone binaries for all platforms
        run: |
          mkdir -p dist
          bun build src/index.ts --compile --target=bun-darwin-arm64 --outfile dist/model-router-darwin-arm64
          bun build src/index.ts --compile --target=bun-darwin-x64 --outfile dist/model-router-darwin-x64
          bun build src/index.ts --compile --target=bun-linux-x64 --outfile dist/model-router-linux-x64
          bun build src/index.ts --compile --target=bun-linux-arm64 --outfile dist/model-router-linux-arm64

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum model-router-* > checksums.txt

      - name: Determine tag name
        id: tag_name
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: model-router ${{ steps.tag_name.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/model-router-darwin-arm64
            dist/model-router-darwin-x64
            dist/model-router-linux-x64
            dist/model-router-linux-arm64
            dist/checksums.txt
